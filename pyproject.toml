[project]
name = "mmc"
version = "1.0.0"
description = "A structure-source comparison on genome-scale single-cell perturbation data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "polars>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "cma>=3.3",
    "jax>=0.4",
    "anthropic>=0.116",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B905"]

[tool.coverage.run]
source = ["mmc"]
# Coverage targets the offline-testable core. The modules below need resources the offline
# test environment does not have: the differential-expression store or the model API.
omit = [
    "tests/*",
    "mmc/shared/llm.py",
    "mmc/shared/store.py",
    "mmc/loop/run.py",
]
